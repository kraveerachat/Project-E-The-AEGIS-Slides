name: Verify presentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
